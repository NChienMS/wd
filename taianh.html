<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gửi ảnh cưới ẩn danh</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Roboto', sans-serif;
      background: url('https://images.unsplash.com/photo-1519741497674-411a16fdeda') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      width: 100%;
      background: rgba(255, 255, 255, 0.95);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(223, 71, 88,0.3);
      text-align: center;
    }
    .header-image {
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #df4758;
      margin-top: -180px;
      box-shadow: 10px 0px 30px rgba(223, 71, 88, 0.2);
    }
    h2 {
      font-family: 'Great Vibes', cursive;
      font-size: 2.5rem;
      color: #d4a5a5;
      margin-bottom: 20px;
    }
    .file-input-wrapper {
      margin: 20px 0;
      position: relative;
    }
    input[type="file"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #d4a5a5;
      border-radius: 8px;
      font-size: 1rem;
      background: white;
      transition: border-color 0.3s;
    }
    input[type="file"]:focus {
      outline: none;
      border-color: #b58383;
    }
    button {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      background: #d4a5a5;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
      font-weight: 400;
    }
    button:hover:not(:disabled) {
      background: #df4758;
    }
    button:disabled {
      background: #cccccc;
      cursor: not-allowed;
    }
    ul#statusList {
      margin-top: 20px;
      padding: 0;
      list-style: none;
    }
    li {
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 8px;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    li.success {
      background: #f3e7e9;
      color: #2e7d32;
    }
    li.error {
      background: #ffebee;
      color: #d32f2f;
    }
    @media (max-width: 480px) {
      .container {
        padding: 15px;
      }
      h2 {
        font-size: 2rem;
      }
      .header-image {
        width: 120px;
        height: 120px;
      }
      input[type="file"], button {
        font-size: 0.9rem;
      }
    }
    a {
      text-decoration: none;
      color: #f4758e;
      position: relative;
      transition: color 0.3s ease;
    }
    a::after {
      content: "";
      position: absolute;
      width: 0%;
      height: 2px;
      left: 0;
      bottom: -2px;
      background-color: #f4758e;
      transition: width 0.3s ease;
    }
    a:hover {
      color: #d15570;
    }
    a:hover::after {
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="anh">
      <img src="https://chyen.love/images/blog/sl2.webp" width="250px" height="250px" alt="Wedding Photo" class="header-image">
    </div>
    <h2>📸 Đóng góp ảnh kỷ niệm 📸</h2>
    <p>Mọi hình ảnh quý khách tải lên sẽ không công khai lên bất kỳ nền tảng nào!</p>
    <div class="file-input-wrapper">
      <input type="file" id="fileInput" accept="image/*" multiple>
    </div>
    <button onclick="uploadFiles()">Tải ảnh lên</button>
    <div style="margin-top:10px; width: 100%; text-align: right;color: #f4758;">
      <a href="https://chyen.love"> ♥️ Xem trang web</a>
    </div>
    <ul id="statusList"></ul>
  </div>

  <script>
    const UPLOAD_URL = "https://script.google.com/macros/s/AKfycbzSs1xmnfMZA0VHX6se-Qjj2ZpyYi3ILcO-lKxFIKB6cheDIZmQ-BSRflrxMWVC_2BHnw/exec";

    async function uploadSingleFile(file, statusList) {
      const listItem = document.createElement("li");
      listItem.textContent = `📸 ${file.name} - Đang gửi...`;
      statusList.appendChild(listItem);

      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = async () => {
          const base64Data = reader.result.split(',')[1];
          const form = new FormData();
          form.append("filedata", base64Data);
          form.append("filename", file.name);
          form.append("mimetype", file.type);

          try {
            const response = await fetch(UPLOAD_URL, {
              method: "POST",
              body: form
            });
            const text = await response.text();

            if (text.includes("http")) {
              listItem.textContent = `📸 ${file.name} - Thành Công`;
              listItem.className = "success";
            } else {
              listItem.textContent = `📸 ${file.name} - ❌ ${text}`;
              listItem.className = "error";
            }
            resolve();
          } catch (err) {
            listItem.textContent = `📸 ${file.name} - ❌ Lỗi: ${err.message}`;
            listItem.className = "error";
            resolve();
          }
        };
        reader.readAsDataURL(file);
      });
    }

    async function uploadFiles() {
      const fileInput = document.getElementById("fileInput");
      const files = fileInput.files;
      const statusList = document.getElementById("statusList");
      const uploadButton = document.querySelector("button");

      // Disable button and change text
      uploadButton.textContent = "Đang tải... Vui lòng chờ.";
      uploadButton.disabled = true;

      statusList.innerHTML = "";

      if (files.length === 0) {
        alert("Vui lòng chọn ít nhất 1 ảnh.");
        uploadButton.textContent = "Tải ảnh lên";
        uploadButton.disabled = false;
        return;
      }

      for (const file of files) {
        await uploadSingleFile(file, statusList);
      }

      // Reset file input and button
      fileInput.value = "";
      uploadButton.textContent = "Tải ảnh lên";
      uploadButton.disabled = false;
    }
  </script>
</body>
</html>
