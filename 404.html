<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 – Wedding Style</title>
  <meta name="description" content="Trang không tồn tại – phong cách đám cưới tinh giản." />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#fafafa;
      --paper:#ffffff;
      --ink:#111827;
      --ink-soft:#6b7280;
      --brand:#b38b59;
      --accent:#e9d8c3;
      --ring:#e5e7eb;
      --radius:22px;
      --shadow:0 20px 40px rgba(0,0,0,.08);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color:var(--ink);
      background: radial-gradient(1200px 800px at 80% -20%, #fff 0%, var(--bg) 60%),
                  radial-gradient(800px 600px at -10% 120%, #fff 0%, var(--bg) 70%);
      display:flex;align-items:center;justify-content:center;padding:16px;
    }

    .card{
      position:relative;
      max-width: 860px;
      width:100%;
      background: var(--paper);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
      border:1px solid var(--ring);
    }

    .ribbon{height:10px;width:100%;background: linear-gradient(90deg, var(--accent), #fff, var(--accent));opacity:.75}

    .floral{position:absolute; inset:0; pointer-events:none}
    .floral:before,.floral:after{content:""; position:absolute; width:220px; height:220px; opacity:.18; filter: drop-shadow(0 6px 8px rgba(0,0,0,.05)); background-repeat:no-repeat; background-size:contain;}
    .floral:before{ left:-10px; top:-10px; background-image:url('data:image/svg+xml;utf8,<?xml version="1.0"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="%23b38b59"/><stop offset="1" stop-color="%23d7bea1"/></linearGradient></defs><path fill="url(%23g)" d="M10 120c40-40 60-80 120-90 10 30-10 60-40 80s-60 30-80 10z"/><circle cx="150" cy="40" r="10" fill="%23b38b59" opacity=".6"/></svg>'); }
    .floral:after{ right:-6px; bottom:-6px; transform: rotate(180deg); background-image:url('data:image/svg+xml;utf8,<?xml version="1.0"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><defs><linearGradient id="g2" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="%23b38b59"/><stop offset="1" stop-color="%23d7bea1"/></linearGradient></defs><path fill="url(%23g2)" d="M10 120c40-40 60-80 120-90 10 30-10 60-40 80s-60 30-80 10z"/><circle cx="150" cy="40" r="10" fill="%23b38b59" opacity=".6"/></svg>'); }

    header{padding: clamp(24px, 6vw, 56px) clamp(20px, 6vw, 56px) 16px;text-align:center;position:relative;background:radial-gradient(600px 120px at 50% 0%, rgba(179,139,89,.15), transparent 70%)}
    .script{font-family:"Great Vibes", cursive; font-size: clamp(40px, 8vw, 84px); line-height:1; color: var(--brand)}
    .subtitle{color:var(--ink-soft); letter-spacing:.3em; text-transform:uppercase; font-size:.78rem; margin-top:.5rem}

    .status{margin-top:22px; font-size: clamp(18px, 2.4vw, 22px)}
    .big404{font-size: clamp(56px, 14vw, 160px); font-weight:600; letter-spacing:.03em; color:#1f2937}

    main{padding: 0 clamp(20px, 6vw, 56px) clamp(24px, 6vw, 56px); text-align:center}
    .note{max-width:660px; margin:0 auto; color:var(--ink-soft); font-size:1rem; line-height:1.75}

    .petal{ position: fixed; top:-10vh; width:14px; height:18px; pointer-events:none; opacity:.4; animation: fall linear forwards; will-change: transform, opacity; }
    .petal svg{ width:100%; height:100% }
    @keyframes fall{0%{ transform: translate3d(var(--x,0), -10vh, 0) rotate(0deg)}70%{opacity:.5}100%{ transform: translate3d(var(--xEnd,0), 110vh, 0) rotate(360deg); opacity:0 }}

    footer{ padding: 26px; text-align:center; color: var(--ink-soft); font-size:.9rem; border-top:1px dashed #eee; background: linear-gradient(180deg, transparent, #fff)}

    @media (max-width: 480px){.note{font-size:.95rem}}
  </style>
</head>
<body>
  <div class="card" role="document" aria-labelledby="title">
    <div class="ribbon" aria-hidden="true"></div>
    <div class="floral" aria-hidden="true"></div>

    <header>
      <div id="title" class="script">We're Getting Married</div>
      <div class="subtitle">T r a n g &nbsp; k h ô n g &nbsp; t ồ n &nbsp; t ạ i</div>
      <div class="status" aria-live="polite">
        <span class="big404">404</span>
      </div>
    </header>

    <main>
      <p class="note">Có thể bạn ghé nhầm lối rồi. Hãy quay lại trang chủ để tiếp tục khám phá câu chuyện tình yêu ❤</p>
    </main>

    <footer>
      <span id="year"></span> · Với tình yêu và sự nâng niu.
    </footer>
  </div>

  <template id="petalTpl">
    <div class="petal" aria-hidden="true">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2c3 2 7 5 7 9 0 5-4 9-7 9s-7-4-7-9c0-4 4-7 7-9z" fill="#b38b59"/>
      </svg>
    </div>
  </template>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const tpl = document.getElementById('petalTpl');
    const rand = (min, max) => Math.random() * (max - min) + min;
    function spawnPetal(){
      const clone = tpl.content.firstElementChild.cloneNode(true);
      const startX = rand(-10, window.innerWidth + 10);
      const drift = rand(-100, 100);
      const dur = rand(9, 14);
      clone.style.left = startX + 'px';
      clone.style.setProperty('--x', '0px');
      clone.style.setProperty('--xEnd', drift + 'px');
      clone.style.animationDuration = dur + 's';
      clone.style.animationDelay = rand(0, 3) + 's';
      document.body.appendChild(clone);
      clone.addEventListener('animationend', () => clone.remove());
    }
    for(let i=0;i<10;i++) spawnPetal();
    setInterval(() => spawnPetal(), 1400);
  </script>
</body>
</html>
