<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Trang chỉ đường nhanh đến địa điểm đám cưới – mở Google Maps chỉ với 1 chạm.">
  <meta property="og:title" content="Chỉ đường đến đám cưới" />

  <meta property="og:image" content="https://ariesvn8.wordpress.com/wp-content/uploads/2025/11/chyen.jpg" />
  <meta name="theme-color" content="#ff6aa2">
  <style>
    body{
      margin:0;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      background:#fff5f8;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      color:#c83d6b;
      text-align:center;
    }
    .box{
      background:white;
      padding:30px 40px;
      border-radius:20px;
      box-shadow:0 10px 30px rgba(255,106,162,0.2);
    }
    h1{
      font-size:20px;
      margin:0 0 12px;
    }
    p{
      margin:0 0 16px;
      font-size:15px;
      color:#555;
    }
    a{
      display:inline-block;
      padding:12px 22px;
      border-radius:999px;
      background:linear-gradient(90deg,#ff6aa2,#ff9770);
      color:white;
      text-decoration:none;
      font-weight:600;
      box-shadow:0 6px 18px rgba(255,151,112,.35);
      transition:transform .15s ease;
    }
    a:hover{ transform:scale(1.05); }
  </style>
</head>
<body>
  <div class="box">
    <h1>🔗 Xem bằng trình duyệt</h1>
    <p>Vui lòng bấm nút bên dưới để mở trang hướng dẫn chỉ đường:</p>
    <a href="https://chyen.love/mapwd" target="_blank" rel="noopener">Mở ngay</a>
  </div>
</body>
</html>
