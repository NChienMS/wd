<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phiếu Thanh Toán</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
           
        }
        .ticket {
            width: 57mm;
            margin: 0 auto;
            border: 1px solid #000;
            padding: 5px;
            text-align: left;
        }
   
        .logo {
            display: block;
            margin: 0 auto 10px;
            width: 100px;
            height: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 12px;
        }
        table, th, td {
            border: 1px solid #000;
            padding: 5px;
            text-align: center;
        }
        th:nth-child(1), td:nth-child(1) { /* Cột STT */
            width: 10%;
            cursor: pointer;
        }
        th:nth-child(2), td:nth-child(2) { /* Cột Tên */
            width: 45%;
            text-align: left;
        }
        th:nth-child(3), td:nth-child(3) { /* Cột SL */
            width: 10%;
        }
        th:nth-child(4), td:nth-child(4) { /* Cột Giá */
            width: 20%;
            text-align: right;
        }
        th:nth-child(5), td:nth-child(5) { /* Cột Tổng */
            width: 15%;
            text-align: right;
        }
        td[contenteditable="true"] {
            outline: none;
        }
        .item-name {
            white-space: normal;
            word-wrap: break-word;
        }
        .total {
            font-weight: bold;
            text-align: right;
        }
        .thank-you {
            text-align: center;
            margin-top: 10px;
            font-style: italic;
        }
        .btn-container {
            margin-top: 20px;
        }
        .print-btn, .add-btn {
            padding: 10px;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;

        }
        .print-btn {
            background-color: #4CAF50;
        }
        .print-btn:hover {
            background-color: #45a049;
        }
        .add-btn {
            background-color: #008CBA;
          
        }
        .add-btn:hover {
            background-color: #007bb5;
        }
        .size{
            font-size: 12px;
        }
        .sizestore{
            font-size: 20px;
        }
        .giua{
            text-align: center;
        }
        .cantrai{
            text-align: left;
        }
        .bold{
            font-weight: bold;
        }
        p{
            margin-top: -5px;
        }
        #print-btn{
            display: none;
        }
    </style>
</head>
<body>
    <div class="ticket" id="ticket">
        <a href="https://ariesvn8.wordpress.com/wp-content/uploads/2021/07/add.png" target="_blank">
            <img src="https://ariesvn8.wordpress.com/wp-content/uploads/2021/07/add.png" alt="Logo" class="logo">
        </a>
        <p class="giua bold sizestore">The ADN</p>
        <p class="giua size">174 đường Láng<br>+84337260123</p>
        <p class="giua bold sizestore">Phiếu Thanh Toán <br>
            <span class="size"id="soPhieu"> Số phiếu: Chưa khởi tạo</span>
        </p>
        <p class="size" id="dateCreated">Ngày tạo: Chưa khởi tạo</p>
        <table id="itemsTable">
            <thead>
                <tr style="text-align: center;">
                    <th>TT</th>
                    <th style="text-align:center;">Tên món</th>
                    <th style="text-align:center;">SL</th>
                    <th style="text-align:center;">Đ.Giá</th>
                    <th style="text-align:center;">T.Tiền</th>
                </tr>
            </thead>
            <tbody id="itemsBody">
                <tr>
                    <td class="stt">1</td>
                    <td class="item-name" contenteditable="true"></td>
                    <td  contenteditable="true" oninput="updateRow(this)"></td>
                    <td style="text-align:right;" contenteditable="true" oninput="updateRow(this)"></td>
                    <td class="total-amount"></td>
                </tr>
            </tbody>
        </table>
        <p class=" size">Tổng SL món: <span id="totalItems">0</span></p>
        <p class=" size total">Thành tiền: <span id="totalPrice">0</span></p>
        <p class=" size total">Tổng thanh toán: <span id="finalTotal">0</span></p>
        <p class=" size thank-you">Cảm ơn quý khách!</p>
    </div>
    <div class="btn-container giua " style="display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; height: 100v; ">
         <button  class="add-btn" onclick="addRow()">Thêm Món</button><br>
           <button  class="add-btn" onclick="printDate()">Lấy ngày</button><br>
        <button   id="print-btn" class="print-btn" onclick="printTicket()">In Phiếu</button>
    </div>

    <script>
        function formatNumber(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        }

        function parseNumber(str) {
            return parseFloat(str.replace(/\./g, "")) || 0;
        }

        function moveCursorToEnd(element) {
            const range = document.createRange();
            const selection = window.getSelection();
            range.selectNodeContents(element);
            range.collapse(false);
            selection.removeAllRanges();
            selection.addRange(range);
        }

        function updateRow(element) {
            const row = element.parentElement;
            const cell = element;

            let rawValue = parseNumber(cell.textContent);
            cell.textContent = formatNumber(rawValue);
            moveCursorToEnd(cell);

            const quantity = parseNumber(row.cells[2].textContent);
            const price = parseNumber(row.cells[3].textContent);
            const total = quantity * price;
            row.cells[4].textContent = formatNumber(total);

            updateTotals();
        }

        function updateTotals() {
            const rows = document.querySelectorAll("#itemsBody tr");
            let totalItems = 0;
            let totalPrice = 0;

            rows.forEach(row => {
                const quantity = parseNumber(row.cells[2].textContent);
                const total = parseNumber(row.cells[4].textContent);
                totalItems += quantity;
                totalPrice += total;
            });

            document.getElementById("totalItems").textContent = formatNumber(totalItems);
            document.getElementById("totalPrice").textContent = formatNumber(totalPrice);
            document.getElementById("finalTotal").textContent = formatNumber(totalPrice);
        }

        function addRow() {
            const tbody = document.getElementById("itemsBody");
            const rowCount = tbody.rows.length + 1;
            const row = document.createElement("tr");
            row.innerHTML = `
                <td class="stt">${rowCount}</td>
                <td class="item-name" contenteditable="true"></td>
                <td contenteditable="true" oninput="updateRow(this)"></td>
                <td contenteditable="true" oninput="updateRow(this)"></td>
                <td class="total-amount"></td>
            `;
            tbody.appendChild(row);
            updateRowNumbers();
        }

        function updateRowNumbers() {
            const rows = document.querySelectorAll("#itemsBody tr");
            rows.forEach((row, index) => {
                row.cells[0].textContent = index + 1;
            });
        }

        document.getElementById("itemsBody").addEventListener("click", function(e) {
            if (e.target.classList.contains("stt")) {
                const row = e.target.parentElement;
                row.remove();
                updateRowNumbers();
                updateTotals();
            }
        });

        function printTicket() {
            const ticket = document.getElementById("ticket").innerHTML;
            const originalContent = document.body.innerHTML;
            document.body.innerHTML = ticket;
            window.print();
            document.body.innerHTML = originalContent;
        }
    </script>
<script>
        function printDate() {
            const now = new Date();
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = now.getFullYear();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');

            const formattedDate = `${day}/${month}/${year} ${hours}:${minutes}`;
            const soPhieu = `${day}${month}${hours}${minutes}`;
            document.getElementById('print-btn').style = 'display:block; ';
            document.getElementById('dateCreated').textContent = `Ngày tạo: ${formattedDate}`;
            document.getElementById('soPhieu').textContent = `Số phiếu: ${soPhieu}`;
        }
    </script>
</body style="text-align: center;">
</html>
