<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gửi ảnh cưới ẩn danh</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Roboto', sans-serif;
      background: url('https://images.unsplash.com/photo-1519741497674-411a16a1fded') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      width: 100%;
      background: rgba(255, 255, 255, 0.95);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    h2 {
      font-family: 'Great Vibes', cursive;
      font-size: 2.5rem;
      color: #d4a5a5;
      margin-bottom: 20px;
    }
    .file-input-wrapper {
      margin: 20px 0;
      position: relative;
    }
    input[type="file"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #d4a5a5;
      border-radius: 8px;
      font-size: 1rem;
      background: white;
      transition: border-color 0.3s;
    }
    input[type="file"]:focus {
      outline: none;
      border-color: #b5838d;
    }
    button {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      background: #d4a5a5;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
      font-weight: 400;
    }
    button:hover {
      background: #b5838d;
    }
    ul#statusList {
      margin-top: 20px;
      padding: 0;
      list-style: none;
    }
    li {
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 8px;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    li.success {
      background: #f3e7e9;
      color: #2e7d32;
    }
    li.error {
      background: #ffebee;
      color: #d32f2f;
    }
    @media (max-width: 480px) {
      .container {
        padding: 20px;
      }
      h2 {
        font-size: 2rem;
      }
      input[type="file"], button {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>📸 Gửi ảnh cưới ẩn danh</h2>
    <div class="file-input-wrapper">
      <input type="file" id="fileInput" accept="image/*" multiple>
    </div>
    <button onclick="uploadFiles()">Tải ảnh lên</button>
    <ul id="statusList"></ul>
  </div>

  <script>
    const UPLOAD_URL = "https://script.google.com/macros/s/AKfycbzSs1xmnfMZA0VHX6se-Qjj2ZpyYi3ILcO-lKxFIKB6cheDIZmQ-BSRflrxMWVC_2BHnw/exec";

    async function uploadSingleFile(file, statusList) {
      const listItem = document.createElement("li");
      listItem.textContent = `📸 ${file.name} - Đang gửi...`;
      statusList.appendChild(listItem);

      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = async () => {
          const base64Data = reader.result.split(',')[1];
          const form = new FormData();
          form.append("filedata", base64Data);
          form.append("filename", file.name);
          form.append("mimetype", file.type);

          try {
            const response = await fetch(UPLOAD_URL, {
              method: "POST",
              body: form
            });
            const text = await response.text();

            if (text.includes("http")) {
              listItem.textContent = `📸 ${file.name} - Thành Công`;
              listItem.className = "success";
            } else {
              listItem.textContent = `📸 ${file.name} - ❌ ${text}`;
              listItem.className = "error";
            }
            resolve();
          } catch (err) {
            listItem.textContent = `📸 ${file.name} - ❌ Lỗi: ${err.message}`;
            listItem.className = "error";
            resolve();
          }
        };
        reader.readAsDataURL(file);
      });
    }

    async function uploadFiles() {
      const fileInput = document.getElementById("fileInput");
      const files = fileInput.files;
      const statusList = document.getElementById("statusList");
      statusList.innerHTML = "";

      if (files.length === 0) {
        alert("Vui lòng chọn ít nhất 1 ảnh.");
        return;
      }

      for (const file of files) {
        await uploadSingleFile(file, statusList);
      }

      // Reset file input
      fileInput.value = "";
    }
  </script>
</body>
</html>
