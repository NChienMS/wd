<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Tải về Printer NT</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Poppins", system-ui, sans-serif;
      background: linear-gradient(135deg, #2b1055, #7597de);
      overflow: hidden;
    }

    /* Hiệu ứng ánh sáng động */
    body::before {
      content: "";
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
      top: -100px;
      left: -100px;
      animation: glow 6s infinite alternate ease-in-out;
      z-index: 0;
    }

    @keyframes glow {
      from { transform: translate(0, 0) scale(1); opacity: 0.6; }
      to { transform: translate(50px, 80px) scale(1.2); opacity: 0.2; }
    }

    .card {
      position: relative;
      z-index: 1;
      text-align: center;
      background: rgba(255, 255, 255, 0.15);
      padding: 40px 50px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      animation: fadeIn 0.8s ease-out;
      max-width: 350px;
      width: 90%;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 2em;
      margin-bottom: 10px;
      color: #fff;
      letter-spacing: 1px;
    }

    p {
      color: #dbeafe;
      margin-bottom: 25px;
      font-size: 1em;
    }

    a {
      display: inline-block;
      padding: 14px 30px;
      background: linear-gradient(45deg, #00c6ff, #0072ff);
      color: #fff;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.05em;
      letter-spacing: 0.5px;
      box-shadow: 0 5px 15px rgba(0, 114, 255, 0.4);
      transition: all 0.25s ease;
    }

    a:hover {
      background: linear-gradient(45deg, #92fe9d, #00c9ff);
      color: #000;
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0, 255, 255, 0.5);
    }

    .icon {
      font-size: 50px;
      margin-bottom: 15px;
      color: #00c9ff;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.15); opacity: 1; }
    }
  </style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a2e0d6cf9b.js" crossorigin="anonymous"></script>
</head>

<body>
  <div class="card">
    <div class="icon">
      <i class="fa-solid fa-download"></i>
    </div>
    <h1>Hello!</h1>
    <p>Nhấn nút bên dưới để tiếp tục tải ứng dụng Printer NT</p>
    <a href="https://github.com/NChienMS/nextool-config/releases/download/PRINTERNT/Printer.NT.apk">
      🚀 TIẾP TỤC
    </a>
  </div>
</body>
</html>
